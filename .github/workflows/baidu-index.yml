# 百度指数重采 —— 嫁金钗
#
# 前置（一次性，都在 GitHub 网页上设）：
#   1. Settings → Secrets and variables → Actions → New repository secret，名字 BDUSS
#   2. Settings → Actions → General → Workflow permissions → Read and write
#   3. 本文件放 .github/workflows/ 下，fetch_baidu_index.mjs 放仓库根
#      （脚本和 index.html 必须同一个仓库根，跟《伟大的长征》那边一模一样）
#
# 看板读的是 index.html 同目录的 ./baidu-index.json，所以下面 BAIDU_OUT 默认就是仓库根。
# 只有当你把嫁金钗塞进某个子目录（比如和长征共用一个仓库、站点在 /jiajinchai/ 下）时，
# 才需要把这一行改成 jiajinchai/baidu-index.json —— 改这一处就够，提交步骤用的是同一个变量。
#
# 节拍不在这里，在 Worker 的 Settings → Triggers 页上（cron 是 UTC）。
# 2026-10-18 起是 */30 3-12 = 北京 11:00~20:30 每半小时一格，20 格/天，两个仓库共用同一个闹钟
# 所以这里改一处、长征那边跟着一起慢。为什么给这么密：百度官方说 12~16 出昨天的数，
# 但实测既不固定也可能整天不出（10-18 那天它自己还停在 10-16），出数即抓才不用干等三小时。
# 一个格子管一天只有一次真 commit：asof 前进才写文件，其余每一轮由下面那个「要不要跑」
# 步骤挡在装浏览器之前，二十几秒就结束 —— 不开无头浏览器、不重打百度、不触发 Pages 重建。
# ⚠ 半小时是赌百度只看间距不看总数。真吃了 10001 就退回 5 3-12（一小时一格）观察两天。
#
# ⚠ 但这条 schedule 现在是**死的**：GitHub 的定时事件从他这个账号整个停了
#   （jjc / wddcz / TieBaSign 三个仓库 event=schedule 合计只剩 10-08 以前的记录，
#   而手动 workflow_dispatch 一直是好的）。所以真正每天敲门的是他那个 Cloudflare
#   Worker 的 Cron Triggers，它 POST 这个接口的 dispatches 来叫这条 workflow。
#   下面的 schedule 只当备份，故意错开分钟（13:40 / 17:40），免得和主闹钟同一分钟
#   撞进同一个 concurrency 组、被 cancel-in-progress 把自己掐了。
# 注意：YAML 的注释只能以 # 开头，写成 /* */ 会让整个文件解析失败、GitHub 直接不认这个 workflow。

name: baidu-index-jiajinchai

on:
  schedule:
    - cron: '40 5,9 * * *'
  workflow_dispatch:

permissions:
  contents: write
  # 上面那个护栏要读本工作流的 run 列表。一旦写了 permissions 这一节，没列出来的
  # 作用域就全是 none，所以 actions 必须显式给 read —— 不给的话护栏永远读到 9999，
  # 静默失效，比没有还难查。
  actions: read

concurrency:
  group: baidu-index-jiajinchai
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BAIDU_OUT: baidu-index.json
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # 两句话：仓库里这份已经是昨天的数了 → 跳过；或者距上一条 run 不足 GAP 分钟 → 跳过。
      # 第二句是防手点的：手点十次就是十次真抓，账号最快也只挨 GAP 分钟一次。
      # ⚠ GAP 必须**小于** Worker 的节拍（现在北京 11:00~20:30 每半小时一格）。
      #   填 90 的话，20 格里只有约 7 格真跑，其余全成 skip，Actions 列表看着像坏了。
      #   20 这个数是"挡住连点、放过正常排班"：GitHub 排队抖动一般也就十几分钟。
      # ⚠ 时钟只能用 run 历史，不能用 baidu-index.json 里的 fetchedAt —— 百度没出数时
      #   脚本压根不写文件（fetch_baidu_index.mjs 末尾 prev >= asof 那句），fetchedAt 会停在
      #   好几天前。2026-10-18 就是这样：百度还停在 10-16，七个格子全成真抓，一个没跳过。
      # ⚠ 要用 BAIDU_PROBE 探测模式时，把下面三处 if 临时删掉 —— 探测模式本来就该每轮真跑。
      - name: 要不要跑
        id: need
        env:
          WF: baidu-index.yml     # API 认的是工作流文件名，不是 name 字段
          GAP: '20'               # 两次真抓之间最少隔这么多分钟
        run: |
          want=$(TZ=Asia/Shanghai date -d "yesterday" +%F)
          have=$(node -p "try{JSON.parse(require('fs').readFileSync('$BAIDU_OUT','utf8')).asof}catch(e){''}")
          curl -sS -m 20 -H "Authorization: Bearer $GITHUB_TOKEN" \
               -H "Accept: application/vnd.github+json" \
               -o _runs.json \
               "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/$WF/runs?per_page=10" || :
          since=$(node -p "try{const j=JSON.parse(require('fs').readFileSync('_runs.json','utf8'));const m=(j.workflow_runs||[]).filter(r=>r.id!==+process.env.GITHUB_RUN_ID).map(r=>(Date.now()-Date.parse(r.created_at))/6e4);m.length?Math.floor(Math.min(...m)):9999}catch(e){9999}")
          # API 没答话（权限没给、网络抖）就当没有上一条：护栏失效但抓取照跑。
          # 反过来 fail-closed 的话，一个 curl 抖动就能让百度指数连着几天不出数。
          case "$since" in ''|*[!0-9]*) since=9999 ;; esac
          echo "仓库里 asof=$have（期望 $want）· 距上一条 run $since 分钟（下限 $GAP）"
          if [ -n "$have" ] && [ "$have" = "$want" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"; echo "已经是昨天的数，收工"
          elif [ "$since" -lt "$GAP" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"; echo "距上次不足 $GAP 分钟，这发不去敲百度"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 装 Playwright + Chromium
        if: steps.need.outputs.skip != 'true'
        run: npm i -D playwright && npx playwright install --with-deps chromium

      # 第一次跑先别配 secret，把 BAIDU_PROBE 前面的 # 删掉做一次"机房 IP 探测"：
      #   PROBE OK                  = 无头浏览器签名被百度接受、Actions 的 IP 干净，再回来配 BDUSS
      #   PROBE FAIL · status=10018 = 机房 IP 被风控，这条路死，退回人工快照
      - name: 抓取
        if: steps.need.outputs.skip != 'true'
        env:
          BDUSS: ${{ secrets.BDUSS }}
          BAIDU_WORD: 嫁金钗
          BAIDU_DAYS: '90'
          # BAIDU_PROBE: '1'
        run: node fetch_baidu_index.mjs

      - name: 提交结果
        if: steps.need.outputs.skip != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          [ -f "$BAIDU_OUT" ] || { echo "::notice::没有产出文件，跳过提交（探测模式或抓取失败）"; exit 0; }
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$BAIDU_OUT"
          git diff --cached --quiet || git commit -m "嫁金钗百度指数 $(date -u +%F)"
          # 同一个仓库还有畅销榜那个工作流在推 main：两个闹钟都是 */30，这一条早十几秒开跑，
          # 它那 commit 落地的时刻正好卡在百度这边 checkout 之后、push 之前 → 非快进被拒。
          # 所以先把远端那一发接回来再推。接不住（同一文件冲突）就这一轮白跑，绝不 force。
          git pull --rebase origin "$GITHUB_REF_NAME" || { echo "::warning::rebase 冲突，这一轮不推"; exit 1; }
          git push
