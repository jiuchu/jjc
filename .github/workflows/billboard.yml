# 优酷 7 日畅销榜重采 —— 嫁金钗
#
# 前置（一次性，都在 GitHub 网页上设）：
#   1. Settings → Actions → General → Workflow permissions → Read and write
#   2. 本文件放 .github/workflows/ 下，fetch_billboard.mjs 和 billboard.json 放仓库根
#      （billboard.json 可以先不传，脚本第一次跑自己建）
#
# 这条比百度指数那条简单得多：取数是匿名签名，没有 cookie、没有 secret、没有浏览器，
# 一个 step 十几秒跑完。所以「装 Playwright」那一步整个没有。
#
# ⚠ 这份文件是"读旧-追加-写新"的：samples[] -history 只存在这个 json 里，
#   优酷那边只有当前值、没有历史接口。所以提交前一定要先 pull --rebase，
#   撞车时宁可让这一轮白跑，也不能把别人攒的采样点覆盖掉。
#
# 节拍不在这里，在 Worker 的 Settings → Triggers 页上（cron 是 UTC）。
# 要的是 */30 * * * * = 一天 48 格。榜是台阶式跳的、上午也跳，所以不能只开 12 点后。
# 48 次/天是 Actions 的自动排队，公共仓库不吃分钟；Worker 只负责发 48 个 POST，
# 额度按 Worker 请求数算，一天不到一百次，离 10 万远得很。
#
# ⚠ 下面的 schedule 是备份，主力闹钟是 Worker 的 Cron Trigger ——
#   GitHub 的定时事件从他这个账号整个停了（2026-10-18 canary 已判完）。
#   备份故意错开分钟（:07 / :37），免得和主闹钟同一分钟撞进同一个 concurrency 组、
#   被 cancel-in-progress 自己掐掉。
# 注意：YAML 的注释只能以 # 开头，写成 /* */ 会让整个文件解析失败、GitHub 直接不认这个 workflow。

# ⚠ 2026-10-19 出事记录：这一度叫 `billboard-jiajinchai`，和同仓库的
#   `baidu-index-jiajinchai` 只差一个词。上传后 GitHub 侧栏里 baidu 那条整个消失了，
#   run 号 60/61 连续编下去、两条都标 Manually run by jiuchu（= Worker 用他 PAT 发的
#   dispatch，时刻正好压在 */30 3-12 的 04:30 / 05:00 UTC 两格）—— 也就是说
#   Worker 每半小时那一发被并到了这个 workflow 实体上，百度指数从此一格也拿不到。
#   所以这里的 name 和 concurrency group 都改成和"百度指数"毫无共同词的写法。
#   以后往这个仓库加 workflow，name 一律用「来源+对象+编号」这种可区分结构，别再用 -jiajinchai 后缀。
name: yk-billboard-10423

on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  # 护栏要读本工作流的 run 列表。写了 permissions 这一节，没列出来的作用域全是 none，
  # 所以 actions 必须显式给 read —— 不给的话护栏永远读到 9999，静默失效。
  actions: read

concurrency:
  group: yk-billboard-10423
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      BILLBOARD_OUT: billboard.json
      BILLBOARD_SHOW: 嫁金钗
      BILLBOARD_KEEP: '1000'
    steps:
      - uses: actions/checkout@v4
        with:
          # 默认只拉 1 层，rebase 撞车时不够用；这个仓库就几个文件，全量便宜。
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # 榜单每半小时都在动，所以不能像百度那条一样"asof 没前进就跳过"。
      # 这里只挡一种情况：距上一条 run 不足 GAP 分钟（手点、或备份 schedule 和主闹钟撞车）。
      # GAP=20 < 30 的节拍，正常排班一格都不会被误杀。
      # API 没答话就当没有上一条：护栏失效但采集照跑，反过来一个 curl 抖动能让榜停更几天。
      - name: 要不要跑
        id: need
        env:
          WF: billboard.yml       # API 认的是工作流文件名，不是 name 字段
          GAP: '20'
        run: |
          curl -sS -m 20 -H "Authorization: Bearer $GITHUB_TOKEN" \
               -H "Accept: application/vnd.github+json" \
               -o _runs.json \
               "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/$WF/runs?per_page=10" || :
          since=$(node -p "try{const j=JSON.parse(require('fs').readFileSync('_runs.json','utf8'));const m=(j.workflow_runs||[]).filter(r=>r.id!==+process.env.GITHUB_RUN_ID).map(r=>(Date.now()-Date.parse(r.created_at))/6e4);m.length?Math.floor(Math.min(...m)):9999}catch(e){9999}")
          case "$since" in ''|*[!0-9]*) since=9999 ;; esac
          echo "距上一条 run $since 分钟（下限 $GAP）"
          if [ "$since" -lt "$GAP" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"; echo "距上次不足 $GAP 分钟，这发不重复采样"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      # 默认就是正式跑，上传完什么都不用改，手动 Run 一次即可。
      # 只有一种情况要动这一行：正式跑挂了、要分清是"机房 IP 被优酷拒"还是"脚本本身有问题"，
      # 就把 run 改成 `BILLBOARD_PROBE=1 node fetch_billboard.mjs` —— 探测模式取数、打印、
      # 但不写文件也不提交。
      #   PROBE OK · ... 第1名 ...    = IP 是干净的，问题在脚本这边
      #   签名三轮没通过 / 解析出 0 条 = 海外 IP 被拒，这条链只能退回人工抄数
      - name: 抓取
        if: steps.need.outputs.skip != 'true'
        run: node fetch_billboard.mjs

      - name: 提交结果
        if: steps.need.outputs.skip != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          [ -f "$BILLBOARD_OUT" ] || { echo "::notice::没有产出文件，跳过提交（探测模式或抓取失败）"; exit 0; }
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$BILLBOARD_OUT"
          git diff --cached --quiet && { echo "这一格和上一格数值完全相同，不提交"; exit 0; }
          git commit -m "畅销榜采样 $(TZ=Asia/Shanghai date '+%F %H:%M')"
          # 采样史全在这个 json 里。先 commit 再 rebase，工作树才是干净的；
          # 接不住就这一轮白跑，绝不 force —— 覆盖掉攒了几天的曲线比少一个点严重得多。
          git pull --rebase origin "$GITHUB_REF_NAME" || { echo "::warning::rebase 冲突，这一轮不推"; exit 1; }
          git push
